<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinyin Lookup</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #1c1c1e;
      --card-bg: #f2f2f7;
      --accent-color: #007aff;
      --subtext-color: #636366;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #000000;
        --text-color: #f2f2f7;
        --card-bg: #1c1c1e;
        --accent-color: #0a84ff;
        --subtext-color: #8e8e93;
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
      margin: 0;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .headword {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent-color);
    }
    .rawpinyin {
      font-style: italic;
      color: var(--subtext-color);
      margin-left: 8px;
    }
    .definitions {
      margin-top: 10px;
      line-height: 1.5;
    }
    .def-item {
      margin-bottom: 6px;
    }
    .not-found {
      color: var(--subtext-color);
      text-align: center;
      padding: 32px 0;
    }
  </style>
</head>
<body>

<div id="app">Loading...</div>

<script>
  // 1. Get query parameter 'q'
  const urlParams = new URLSearchParams(window.location.search);
  const query = (urlParams.get('q') || '').trim();

  // Unicode NFD stripping for normalized matching (kàn -> kan)
  function stripAccents(str) {
    return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[\s\'-]/g, '').toLowerCase();
  }

  async function lookup() {
    const app = document.getElementById('app');
    if (!query) {
      app.innerHTML = '<div class="not-found">No word specified. Use <code>?q=word</code></div>';
      return;
    }

    try {
      // Load pre-compiled JSON dictionary
      const response = await fetch('./dict.json');
      const dict = await response.json();

      const normalizedQuery = stripAccents(query);
      
      // Match exact pinyin key or normalized ASCII key
      const matches = dict.filter(entry => {
        const pinyinMatch = entry.pinyin === query;
        const asciiMatch = stripAccents(entry.pinyin) === normalizedQuery;
        return pinyinMatch || asciiMatch;
      });

      if (matches.length === 0) {
        app.innerHTML = `<div class="not-found">No entries found for <strong>${escapeHtml(query)}</strong></div>`;
        return;
      }

      app.innerHTML = matches.map(entry => `
        <div class="card">
          <div>
            <span class="headword">${escapeHtml(entry.pinyin)}</span>
            <span class="rawpinyin">${escapeHtml(entry.rawpinyin)}</span>
          </div>
          <div class="definitions">
            ${entry.definitions.map((def, idx) => `
              <div class="def-item">
                ${matches.length > 1 || entry.definitions.length > 1 ? `<b>${idx + 1}.</b> ` : '■ '}
                ${escapeHtml(def)}
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');

    } catch (err) {
      app.innerHTML = `<div class="not-found">Error loading dictionary dataset.</div>`;
      console.error(err);
    }
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.innerText = text;
    return div.innerHTML;
  }

  lookup();
</script>

</body>
</html>
